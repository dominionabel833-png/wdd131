<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form assignment for WDD 131 Dynamic Web Fundamentals.">
    <meta name="author" content="Abel Dominion">
    <title>Product Review - WDD 131</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <!-- Product Name Select -->
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating Radio Buttons -->
            <fieldset>
                <legend>Overall Rating <span class="required">*</span></legend>
                <label for="star1"><input type="radio" id="star1" name="rating" value="1" required> ⭐</label>
                <label for="star2"><input type="radio" id="star2" name="rating" value="2" required> ⭐⭐</label>
                <label for="star3"><input type="radio" id="star3" name="rating" value="3" required> ⭐⭐⭐</label>
                <label for="star4"><input type="radio" id="star4" name="rating" value="4" required> ⭐⭐⭐⭐</label>
                <label for="star5"><input type="radio" id="star5" name="rating" value="5" required> ⭐⭐⭐⭐⭐</label>
            </fieldset>

            <!-- Installation Date -->
            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Useful Features Checkboxes -->
            <fieldset>
                <legend>Which features were useful in your decision? (Check all that apply)</legend>
                <label for="durability"><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
                <label for="ease"><input type="checkbox" id="ease" name="features" value="ease"> Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
                <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>
            </fieldset>

            <!-- Written Review Textarea -->
            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <!-- Your Name (Optional) -->
            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Abel Dominion | WDD 131</p>
    </footer>

</body>
</html>
